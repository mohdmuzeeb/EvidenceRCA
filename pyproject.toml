[project]
name = "evidencerca"
version = "0.1.0"
description = "EvidenceRCA research prototype: testbed, telemetry capture and (later) verified, abstaining RCA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "sqlalchemy>=2.0,<2.1",  # opentelemetry-instrumentation-sqlalchemy 0.66b1 supports < 2.1
    "psycopg[binary]",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-sqlalchemy",
    "opentelemetry-instrumentation-system-metrics",
    "opentelemetry-instrumentation-logging>=0.66b1",
]

[dependency-groups]
analysis = [
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
]
dev = ["pytest"]

[tool.uv]
package = false
# Host-side analysis deps are not part of the service image (testbed/requirements.lock = --no-dev, main deps only).
default-groups = ["dev", "analysis"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
